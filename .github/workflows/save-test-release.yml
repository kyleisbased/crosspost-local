name: Save verified desktop test release
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: '43128035816'
      BUILD_COMMIT: '62ef405cb664c7f4d30824631c50445d6fc3746c'
    steps:
      - name: Verify completed native builds
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > run.json
          jq -e --arg sha "$BUILD_COMMIT" '.conclusion == "success" and .head_sha == $sha and .name == "Build desktop test packages"' run.json
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/jobs" > jobs.json
          jq -e '.total_count == 3 and ([.jobs[] | select(.conclusion == "success")] | length == 3)' jobs.json
      - name: Collect the tested archives
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN" --dir downloads
          mkdir release
          cp downloads/Crosspost-windows-latest-TEST-BUILD/Crosspost-win32-x64-*.zip release/Crosspost-Windows-TEST.zip
          cp downloads/Crosspost-macos-15-TEST-BUILD/Crosspost-darwin-arm64-*.zip release/Crosspost-Mac-Apple-Silicon-TEST.zip
          cp downloads/Crosspost-macos-15-intel-TEST-BUILD/Crosspost-darwin-x64-*.zip release/Crosspost-Mac-Intel-TEST.zip
          (cd release && sha256sum *.zip > SHA256SUMS.txt)
      - name: Save private prerelease
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Desktop testing packages for Windows x64, Apple Silicon Mac, and Intel Mac.

          Download the ZIP for your computer, extract it completely, and open Crosspost.exe or Crosspost.app. Node and Chromium are included. Friends do not need developer tools or GitHub to run a ZIP you give them.

          All three native builds passed 31 automated tests, the ten-video dashboard test, and an isolated bundled Node/SQLite/server/Chromium launch check. Build evidence: https://github.com/kyleisbased/crosspost-local/actions/runs/43128035816

          These are unsigned TEST packages. Real account sign-in and publication to YouTube, Instagram and TikTok have not been verified. This is not a production unattended-publishing release. Keep the computer awake and online for local scheduled work. Existing development data is not automatically migrated.
          NOTES
          gh release create v0.1.0-desktop-test release/* --target "$BUILD_COMMIT" --prerelease --latest=false --title "Crosspost 0.1 desktop test packages" --notes-file notes.md
