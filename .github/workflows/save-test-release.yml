name: Save verified desktop test release
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful native build run ID
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.build_run }}
    steps:
      - name: Verify completed native builds
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > run.json
          jq -e --arg repo "$GH_REPO" '.conclusion == "success" and .event == "workflow_dispatch" and .head_repository.full_name == $repo and .path == ".github/workflows/build.yml"' run.json
          echo "BUILD_COMMIT=$(jq -r .head_sha run.json)" >> "$GITHUB_ENV"
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/jobs" > jobs.json
          jq -e '.total_count == 3 and ([.jobs[] | select(.conclusion == "success")] | length == 3)' jobs.json
      - name: Collect the tested archives
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN" --dir downloads
          mkdir release
          cp downloads/Crosspost-windows-latest-TEST-BUILD/Crosspost-win32-x64-*.zip release/Crosspost-Windows-TEST.zip
          cp downloads/Crosspost-macos-15-TEST-BUILD/Crosspost-darwin-arm64-*.zip release/Crosspost-Mac-Apple-Silicon-TEST.zip
          cp downloads/Crosspost-macos-15-intel-TEST-BUILD/Crosspost-darwin-x64-*.zip release/Crosspost-Mac-Intel-TEST.zip
          cp downloads/Crosspost-App-Update/Crosspost-update.json release/Crosspost-update.json
          jq -r '.files[] | select(.path == "scripts/update.mjs") | .data' release/Crosspost-update.json | base64 --decode > release/update.mjs
          echo "APP_VERSION=$(jq -r .version release/Crosspost-update.json)" >> "$GITHUB_ENV"
          (cd release && sha256sum *.zip *.json *.mjs > SHA256SUMS.txt)
      - name: Save public test release
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Crosspost 0.2: Google sign-in and lightweight updates. Desktop testing packages for Windows x64, Apple Silicon Mac, and Intel Mac.

          Download the ZIP for your computer, extract it completely, and open Crosspost.exe or Crosspost.app. Node and Chromium are included. Friends do not need developer tools or GitHub to run a ZIP you give them.

          YouTube now uses Google sign-in in the normal browser and the YouTube Data API. The app owner must configure a Google Desktop OAuth client and allow testers before live sign-in works. See YOUTUBE-SETUP.md in the repository. Automated-browser Google login is disabled.

          Future app-code updates: open Update-Windows.cmd / Update-Mac.command, or ask Codex to "Update Crosspost using its included updater." The updater preserves videos, profiles, sessions and schedules. Older installations can bootstrap using the attached update.mjs file; see UPDATE.md. A global /update slash command is not registered.

          All three native builds passed automated tests, the ten-video dashboard test, the bundled Node/SQLite/server/Chromium check, and an isolated actual-launcher start/reopen/quit check. The Mac launcher is executed directly; Finder and downloaded-app approval still require recipient-machine testing.

          These are unsigned TEST packages. Real account sign-in and publication to YouTube, Instagram and TikTok have not been verified. This is not a production unattended-publishing release. Keep the computer awake and online for local scheduled work. Existing development data is not automatically migrated.
          NOTES
          printf '\nBuild evidence: https://github.com/%s/actions/runs/%s\n' "$GH_REPO" "$BUILD_RUN" >> notes.md
          gh release create "v$APP_VERSION-test-$BUILD_RUN" release/* --target "$BUILD_COMMIT" --prerelease --latest=false --title "Crosspost $APP_VERSION - Google sign-in and updates" --notes-file notes.md
